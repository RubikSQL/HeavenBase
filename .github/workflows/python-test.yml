name: Python Tests

on:
  push:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      suite:
        description: Validation tier to run
        required: true
        default: full
        type: choice
        options:
          - full
          - fast-matrix

jobs:
  fast-matrix:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'fast-matrix') ||
      (github.event_name == 'push' &&
        (contains(github.event.head_commit.message, '[major]') ||
         contains(github.event.head_commit.message, '[release]') ||
         contains(github.event.head_commit.message, '[merge]')))
    runs-on: ubuntu-latest
    # Keep pace with release.yml after backend-matrix growth on the fast tier.
    timeout-minutes: 45
    env:
      # The repository pins .python-version, so uv runs each leg on its matrix
      # Python only when told to; the check below fails a leg that drifts.
      UV_PYTHON: ${{ matrix.python-version }}
      # Match the release matrix: hosted runners expose two CPUs, while four
      # workers keep the I/O-heavy fast tier within the merge feedback budget.
      HB_TEST_WORKERS: "4"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Verify matrix interpreter
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          uv run --extra dev python - <<'PY'
          import os
          import sys

          actual = f"{sys.version_info.major}.{sys.version_info.minor}"
          expected = os.environ["EXPECTED_PYTHON"]
          if actual != expected:
              raise SystemExit(f"uv selected Python {actual}; expected matrix Python {expected}")
          PY
      - run: bash scripts/test.bash

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: ubuntu-latest
    # A two-CPU, four-worker emulation of the hosted runner took about 82 minutes
    # for the complete tier; this allows about 1.5 times that.
    timeout-minutes: 125
    env:
      HB_TEST_WORKERS: "4"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra full --locked
      - run: bash scripts/test.bash -m "fast or full"
