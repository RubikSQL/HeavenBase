name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA of the current release branch head to publish
        required: true
        type: string
      confirmation:
        description: Type "publish-to-pypi" to authorize publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: heavenbase-release
  cancel-in-progress: false

jobs:
  verify_release:
    name: Verify release candidate
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.verify.outputs.release_sha }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release
          fetch-depth: 0

      - name: Verify branch, commit, version, and manual authorization
        id: verify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            +refs/heads/master:refs/remotes/origin/master \
            +refs/heads/release:refs/remotes/origin/release

          release_sha="$(git rev-parse refs/remotes/origin/release)"
          master_sha="$(git rev-parse refs/remotes/origin/master)"

          if [[ "${release_sha}" != "${master_sha}" ]]; then
            echo "release (${release_sha}) must exactly match master (${master_sha})" >&2
            exit 1
          fi
          if ! git show -s --format=%B "${release_sha}" | grep -Fq '[release]'; then
            echo "release head must contain [release] in its commit message" >&2
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${EVENT_SHA}" != "${release_sha}" ]]; then
              echo "push event SHA is no longer the current release branch head" >&2
              exit 1
            fi
          else
            if [[ "${PUBLISH_CONFIRMATION}" != "publish-to-pypi" ]]; then
              echo 'manual publication requires confirmation: publish-to-pypi' >&2
              exit 1
            fi
            if [[ ! "${REQUESTED_RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "release_sha must be a full lowercase Git SHA" >&2
              exit 1
            fi
            if [[ "${REQUESTED_RELEASE_SHA}" != "${release_sha}" ]]; then
              echo "requested SHA is not the current release branch head" >&2
              exit 1
            fi
          fi

          git checkout --detach "${release_sha}"
          version="$(python - <<'PY'
          import re
          import runpy

          value = str(runpy.run_path("src/heavenbase/version.py")["__version__"])
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+", value) is None:
              raise SystemExit(f"release version must be a stable four-part version, got {value!r}")
          if any(str(int(part)) != part for part in value.split(".")):
              raise SystemExit(f"release version must be canonical, got {value!r}")
          print(value)
          PY
          )"

          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Verified HeavenBase ${version} at ${release_sha}"

  quality_gate:
    name: Source quality gate
    needs: verify_release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify_release.outputs.release_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install locked quality environment
        run: uv sync --extra dev --locked

      - name: Check generated environment files
        run: bash scripts/sync-env.bash --check

      - name: Check documentation contract
        run: uv run --extra dev python scripts/docs.py check

      - name: Check generated capability matrix
        run: uv run --extra dev python scripts/gen_capabilities.py --check

      - name: Check source quality
        run: bash scripts/flake.bash --ci

  fast_matrix:
    name: Fast tests (Python ${{ matrix.python-version }})
    needs: verify_release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Backend-matrix growth pushed the hosted fast suite past 25 minutes.
    timeout-minutes: 45
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # Hosted Linux runners expose only two CPUs to xdist. Four workers keep
      # the I/O-heavy fast tier balanced without restoring the broad suite.
      HB_TEST_WORKERS: "4"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify_release.outputs.release_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install locked release-test environment
        run: uv sync --extra dev --extra full --locked

      - name: Verify matrix interpreter
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          uv run --extra dev --extra full python - <<'PY'
          import os
          import sys

          actual = f"{sys.version_info.major}.{sys.version_info.minor}"
          expected = os.environ["EXPECTED_PYTHON"]
          if actual != expected:
              raise SystemExit(f"uv selected Python {actual}; expected matrix Python {expected}")
          PY

      - name: Run daily integrity suite
        run: bash scripts/test.bash

  build:
    name: Build distributions
    needs: [verify_release, quality_gate, fast_matrix]
    if: >-
      always() &&
      needs.verify_release.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.quality_gate.result == 'success' && needs.fast_matrix.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify_release.outputs.release_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install build tooling
        run: uv pip install --system build twine

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist

      - name: Verify and check distribution inventory
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          dist = Path("dist")
          entries = sorted(dist.iterdir())
          files = [path for path in entries if path.is_file()]
          wheels = [path for path in files if path.suffix == ".whl"]
          sdists = [path for path in files if path.name.endswith(".tar.gz")]
          expected_version = os.environ["EXPECTED_VERSION"]

          if len(entries) != 2 or len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
              names = [path.name for path in entries]
              raise SystemExit(f"expected exactly one wheel and one sdist, found {names}")
          expected_sdist = f"heavenbase-{expected_version}.tar.gz"
          expected_wheel_prefix = f"heavenbase-{expected_version}-"
          if sdists[0].name != expected_sdist or not wheels[0].name.startswith(expected_wheel_prefix):
              names = [path.name for path in files]
              raise SystemExit(f"distribution filenames do not match {expected_version}: {names}")

          print("Distribution inventory:")
          for path in files:
              print(f"- {path.name}")
          PY
          python scripts/release.py check-modules dist
          python -m twine check dist/*.whl dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: heavenbase-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  test_dist:
    name: Test ${{ matrix.artifact }} artifact (${{ matrix.os }})
    needs: [verify_release, build]
    if: >-
      always() &&
      needs.verify_release.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheel
          - os: macos-latest
            artifact: wheel
          - os: windows-latest
            artifact: wheel
          - os: ubuntu-latest
            artifact: sdist
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify_release.outputs.release_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: heavenbase-dist
          path: dist

      - name: Install built artifact
        shell: bash
        env:
          ARTIFACT_KIND: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          if [[ "${ARTIFACT_KIND}" == "wheel" ]]; then
            python scripts/release.py install-wheel dist
          else
            python -m pip install --upgrade pip packaging
            python -m pip install dist/*.tar.gz
          fi

      - name: Smoke-test installed artifact
        env:
          EXPECTED_VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          python scripts/release.py smoke
          python -c "import importlib.metadata as m, os; assert m.version('heavenbase') == os.environ['EXPECTED_VERSION']"

      - name: Verify CLI entry point
        shell: bash
        run: hb --help

  publish_pypi:
    name: Publish to PyPI
    needs: [verify_release, test_dist]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.verify_release.result == 'success' &&
      needs.test_dist.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify_release.outputs.release_sha }}
          fetch-depth: 0

      - name: Reverify manual publication authorization
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.verify_release.outputs.release_sha }}
          EXPECTED_VERSION: ${{ needs.verify_release.outputs.version }}
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [[ "${PUBLISH_CONFIRMATION}" != "publish-to-pypi" ]]; then
            echo 'manual publication requires confirmation: publish-to-pypi' >&2
            exit 1
          fi
          if [[ "${REQUESTED_RELEASE_SHA}" != "${EXPECTED_RELEASE_SHA}" ]]; then
            echo "manual release SHA changed after candidate verification" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            +refs/heads/master:refs/remotes/origin/master \
            +refs/heads/release:refs/remotes/origin/release

          release_sha="$(git rev-parse refs/remotes/origin/release)"
          master_sha="$(git rev-parse refs/remotes/origin/master)"
          head_sha="$(git rev-parse HEAD)"
          if [[ "${release_sha}" != "${EXPECTED_RELEASE_SHA}" ]] \
            || [[ "${release_sha}" != "${master_sha}" ]] \
            || [[ "${release_sha}" != "${head_sha}" ]]; then
            echo "release, master, checked-out, and authorized SHAs must still match" >&2
            exit 1
          fi
          if ! git show -s --format=%B "${release_sha}" | grep -Fq '[release]'; then
            echo "release head must contain [release] in its commit message" >&2
            exit 1
          fi

          version="$(python - <<'PY'
          import re
          import runpy

          value = str(runpy.run_path("src/heavenbase/version.py")["__version__"])
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+", value) is None:
              raise SystemExit(f"release version must be a stable four-part version, got {value!r}")
          if any(str(int(part)) != part for part in value.split(".")):
              raise SystemExit(f"release version must be canonical, got {value!r}")
          print(value)
          PY
          )"
          if [[ "${version}" != "${EXPECTED_VERSION}" ]]; then
            echo "release version changed after candidate verification" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: heavenbase-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
