name: Code Quality

on:
  push:
    branches: [master, dev, dev-refactor]
  pull_request:
    branches: [master, dev, dev-refactor]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: uv sync --extra dev --locked
      - run: bun ci
        working-directory: apps/gui
      - run: bun run check
        working-directory: apps/gui
      - run: bash scripts/sync-env.bash --check
      - run: uv run python scripts/openapi.py --check
      - run: uv run --extra dev python scripts/docs.py check
      - run: uv run --extra dev python scripts/gen_capabilities.py --check
      - run: bash scripts/flake.bash --ci

  fast-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Keep pace with release.yml after backend-matrix growth on the fast tier.
    timeout-minutes: 45
    env:
      # Match the release matrix: hosted runners expose two CPUs, while four
      # workers keep the I/O-heavy fast tier within the PR feedback budget.
      HB_TEST_WORKERS: "4"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: bash scripts/test.bash
