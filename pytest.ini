[pytest]
minversion = 6.0
addopts = -ra --strict-markers --disable-warnings -v
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    fast: deterministic daily checks for delivered runtime behavior
    full: opt-in broad, expensive, external, LLM, slow, or detail validation
    unit: isolated unit-level behavior contract
    integration: in-process multi-component behavior contract
    provider: provider-specific behavior contract
    db: database-backed behavior contract
    slow: materially slower than the default integrity suite
    detail: Provider-specific or implementation-detail tests excluded from the default fast integrity suite
    external: Tests requiring external services (docker/db)
    llm: Tests that call online LLM APIs (skipped by default to save costs)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
